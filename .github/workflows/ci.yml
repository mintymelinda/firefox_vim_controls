name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build validation image
        run: docker compose build app browser-tests browser-tests-115 fixture firefox firefox-115
      - name: Run formatter, lint, tests, build, and package in Docker
        run: docker compose run --rm app npm run check
      - name: Run real Firefox Stable browser smoke tests
        run: docker compose run --rm browser-tests npm run test:browser
      - name: Run Firefox 115 ESR browser smoke tests
        run: docker compose run --rm browser-tests-115 npm run test:browser
